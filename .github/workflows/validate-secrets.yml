name: Validate Secrets

on:
  push:
    paths:
      - '**/*.enc.yaml'
      - '**/*.enc.json'
  pull_request:
    paths:
      - '**/*.enc.yaml'
      - '**/*.enc.json'

jobs:
  validate:
    name: Validate Encrypted Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.8.1/sops-v3.8.1.linux.amd64
          chmod +x sops-v3.8.1.linux.amd64
          sudo mv sops-v3.8.1.linux.amd64 /usr/local/bin/sops

      - name: Setup Age key
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt

      - name: Validate encrypted files can be decrypted
        if: ${{ secrets.SOPS_AGE_KEY != '' }}
        run: |
          echo "Validating encrypted secrets..."
          for f in $(find . -name "*.enc.yaml" -o -name "*.enc.json"); do
            echo "Validating $f..."
            sops -d "$f" > /dev/null || {
              echo "::error::Failed to decrypt $f"
              exit 1
            }
            echo "✓ $f is valid"
          done
          echo "All encrypted secrets are valid!"

      - name: Skip decryption (no SOPS key)
        if: ${{ secrets.SOPS_AGE_KEY == '' }}
        run: |
          echo "::warning::SOPS_AGE_KEY not configured - skipping decryption validation"
          echo "Add SOPS_AGE_KEY to repository secrets to enable full validation"
