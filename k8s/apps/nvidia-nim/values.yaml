# NVIDIA NIM LLM Helm Chart Values
# Based on official NVIDIA documentation:
# https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html
#
# Configured for GPU deployment
# Default model: Meta Llama 3.1 8B Instruct
# - 8B parameters, fits on most GPUs (~16GB VRAM)
# - OpenAI-compatible API at /v1/chat/completions
# - 128K context window
#
# IMPORTANT: Requires NGC secrets applied first:
#   ./scripts/apply-secrets.sh

# Container image - NVIDIA NIM LLM
# Using Llama 3.1 8B Instruct - smaller model that fits on single GPU
image:
  # Available real NIM models from NGC:
  # - nvcr.io/nim/meta/llama-3.1-8b-instruct (8B, fits ~16GB, fast)
  # - nvcr.io/nim/meta/llama-3.1-70b-instruct (70B, needs H200 141GB)
  # - nvcr.io/nim/mistralai/mistral-7b-instruct-v0.3 (7B, efficient)
  repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
  tag: "1.3.3"
  pullPolicy: IfNotPresent

# NGC image pull secret (created by apply-secrets.sh)
imagePullSecrets:
  - name: ngc-image-pull

# Always-on, preemptible by batch-high priority (INV-N004)
# KAI scheduler preempts this when Safe Synthesizer needs GPU (INV-N007)
replicaCount: 1

# GPU resources - using KAI Scheduler fractional GPU allocation
# Llama 3.1 8B needs ~16-20GB VRAM, allocating 25GB with headroom
# Dual-model setup with GPT-OSS-120B (80GB): 25 + 80 + 2 (embedding) = 107GB
# Leaves ~34GB for JupyterHub GPU notebooks on H200 141GB
# Note: nvidia.com/gpu: 1 is still required for device mounting; KAI annotation controls memory allocation
resources:
  requests:
    memory: 32Gi
    cpu: 4
    nvidia.com/gpu: 1
  limits:
    memory: 64Gi
    cpu: 8
    nvidia.com/gpu: 1

# Use NVIDIA RuntimeClass (created by bootstrap-rke2.sh)
runtimeClassName: nvidia

# KAI Scheduler for GPU workloads
# Enables fractional GPU, gang scheduling, and topology-aware placement
schedulerName: kai-scheduler

# KAI Queue assignment for inference workloads
# inference-queue has full GPU quota, priority 100
podLabels:
  kai.scheduler/queue: inference-queue

# Priority class - inference is non-preemptible (value 125)
# Can be preempted by batch-high (130) for Safe Synthesizer jobs
priorityClassName: inference

# KAI Scheduler annotations for fractional GPU allocation
# Requests 25GB of GPU memory for Llama 8B (actual usage ~16-20GB)
# Dual-model: Llama 8B (25GB) + GPT-OSS-120B (80GB) + Embedding (2GB) = 107GB
podAnnotations:
  kai.scheduler.nvidia.com/gpu-memory: "25Gi"

# Tolerations for GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Service configuration
service:
  type: ClusterIP
  port: 8000
  # OpenAI-compatible endpoint at /v1/chat/completions
  # Prometheus scraping annotations (metrics exposed at /v1/metrics per NVIDIA NIM docs)
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/v1/metrics"

# Observability configuration
observability:
  # Enable ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: true
    interval: 30s
    # Label to match Prometheus Operator serviceMonitorSelector
    labels:
      release: monitoring

# Environment variables per NVIDIA docs
env:
  # NGC API key for model downloads
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: ngc-credentials
        key: api-key
  # Model cache location
  - name: NIM_CACHE_PATH
    value: "/opt/nim/.cache"
  # Logging level
  - name: NIM_LOG_LEVEL
    value: "INFO"
  # Observability - Prometheus metrics endpoint at /metrics
  - name: NIM_ENABLE_METRICS
    value: "true"
  # Observability - Log full prompts and responses to stdout (captured by Promtail → Loki)
  - name: NIM_LOG_REQUESTS
    value: "true"
  # OpenTelemetry service name (for distributed tracing if Tempo enabled later)
  - name: OTEL_SERVICE_NAME
    value: "nim-llm"
  # Limit GPU memory to match KAI annotation (~25Gi of 141Gi)
  # Without these, NIM grabs ~90% of GPU memory, blocking other models
  # NIM_MAX_MODEL_LEN reduces KV cache; NIM_KVCACHE_PERCENT caps cache allocation
  - name: NIM_MAX_MODEL_LEN
    value: "4096"
  - name: NIM_KVCACHE_PERCENT
    value: "0.15"

# Model cache persistence
# GPT-OSS 120B is ~60GB quantized
persistence:
  enabled: true
  size: 150Gi
  mountPath: /opt/nim/.cache
  accessMode: ReadWriteOnce

# Health probes - MoE models load faster than dense models
startupProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 90
  periodSeconds: 15
  failureThreshold: 30  # Allow 7.5 minutes for model loading

livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

# API fallback disabled - H200 runs GPT-OSS 120B locally
apiFallback:
  enabled: false
