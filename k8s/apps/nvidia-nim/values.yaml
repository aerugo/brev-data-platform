# NVIDIA NIM LLM Helm Chart Values
# Based on official NVIDIA documentation:
# https://docs.nvidia.com/nim/large-language-models/latest/deploy-helm.html
#
# Configured for GPU deployment
# Default model: Meta Llama 3.1 8B Instruct
# - 8B parameters, fits on most GPUs (~16GB VRAM)
# - OpenAI-compatible API at /v1/chat/completions
# - 128K context window
#
# IMPORTANT: Requires NGC secrets applied first:
#   ./scripts/apply-secrets.sh

# Container image - NVIDIA NIM LLM
# Using Llama 3.1 8B Instruct - smaller model that fits on single GPU
image:
  # Available real NIM models from NGC:
  # - nvcr.io/nim/meta/llama-3.1-8b-instruct (8B, fits ~16GB, fast)
  # - nvcr.io/nim/meta/llama-3.1-70b-instruct (70B, needs A100/H100)
  # - nvcr.io/nim/mistralai/mistral-7b-instruct-v0.3 (7B, efficient)
  repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
  tag: "1.3.3"
  pullPolicy: IfNotPresent

# NGC image pull secret (created by apply-secrets.sh)
imagePullSecrets:
  - name: ngc-image-pull

replicaCount: 1

# GPU resources - using KAI Scheduler fractional GPU allocation
# Llama 3.1 8B needs ~20GB VRAM, allocating 70GB for headroom (H200 141GB)
# This allows sharing with JupyterHub GPU notebooks (70GB each = 140GB total)
# Note: nvidia.com/gpu: 1 is still required for device mounting; KAI annotation controls memory allocation
resources:
  requests:
    memory: 32Gi
    cpu: 4
    nvidia.com/gpu: 1
  limits:
    memory: 64Gi
    cpu: 8
    nvidia.com/gpu: 1

# Use NVIDIA RuntimeClass (created by bootstrap-rke2.sh)
runtimeClassName: nvidia

# KAI Scheduler for GPU workloads (Phase 3.5)
# Enables fractional GPU, gang scheduling, and topology-aware placement
schedulerName: kai-scheduler

# KAI Scheduler annotations for fractional GPU allocation
# Requests 70GB of GPU memory (H200 141GB: 70GB NIM + 70GB JupyterHub = 140GB)
podAnnotations:
  kai.scheduler.nvidia.com/gpu-memory: "70Gi"

# Tolerations for GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Service configuration
service:
  type: ClusterIP
  port: 8000
  # OpenAI-compatible endpoint at /v1/chat/completions

# Environment variables per NVIDIA docs
env:
  # NGC API key for model downloads
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: ngc-credentials
        key: api-key
  # Model cache location
  - name: NIM_CACHE_PATH
    value: "/opt/nim/.cache"
  # Logging level
  - name: NIM_LOG_LEVEL
    value: "INFO"

# Model cache persistence
# GPT-OSS 120B is ~60GB quantized
persistence:
  enabled: true
  size: 150Gi
  mountPath: /opt/nim/.cache
  accessMode: ReadWriteOnce

# Health probes - MoE models load faster than dense models
startupProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 90
  periodSeconds: 15
  failureThreshold: 30  # Allow 7.5 minutes for model loading

livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

# API fallback disabled - H200 runs GPT-OSS 120B locally
apiFallback:
  enabled: false
