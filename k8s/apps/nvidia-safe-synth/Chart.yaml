apiVersion: v2
name: nvidia-safe-synth
description: NVIDIA NeMo Safe Synthesizer for privacy-preserving synthetic data generation
type: application
version: 0.2.0
appVersion: "25.01"

# Safe Synthesizer Requirements
# - GPU: 80GB VRAM minimum - requires exclusive GPU access (cannot share with NIM)
# - RAM: 64GB+ recommended
# - Disk: 100GB+ for models and results
#
# NOTE: Safe Synth requires full GPU and cannot run concurrently with NIM.
# It is deployed with replicas: 0 by default. Scale up when needed, scale NIM down.
# Platform requires H200 141GB for NIM + JupyterHub GPU sharing.
#
# Documentation:
# https://docs.nvidia.com/nemo/microservices/latest/generate-private-synthetic-data/
