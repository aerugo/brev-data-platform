{{- if .Values.job.enabled }}
# Safe Synthesizer Job Template
# This Job is triggered by Dagster for synthetic data generation
# Uses KAI Scheduler preemption to temporarily acquire GPU from NIM
#
# How it works:
# 1. Dagster creates this Job via Kubernetes API
# 2. Job has batch-high priority (130) > inference (125)
# 3. KAI preempts NIM pod to free the GPU
# 4. Safe Synth runs to completion
# 5. NIM Deployment restarts automatically
apiVersion: batch/v1
kind: Job
metadata:
  name: safe-synth-job-{{ .Values.job.runId | default "manual" }}
  labels:
    app: safe-synth
    app.kubernetes.io/name: safe-synth
    app.kubernetes.io/component: batch-job
    # KAI Queue assignment - batch queue has no quota, borrows via preemption
    kai.scheduler/queue: batch-queue
  annotations:
    # Allow KAI to preempt lower-priority workloads
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # Don't retry on failure - let Dagster handle retries
  backoffLimit: 0
  # Clean up completed jobs after 1 hour
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: safe-synth
        app.kubernetes.io/name: safe-synth
        app.kubernetes.io/component: batch-job
        kai.scheduler/queue: batch-queue
      annotations:
        # GPU memory allocation for KAI
        kai.scheduler.nvidia.com/gpu-memory: "80Gi"
    spec:
      # Use KAI Scheduler
      schedulerName: kai-scheduler
      # Priority class - batch-high can preempt inference
      priorityClassName: {{ .Values.job.priorityClassName | default "batch-high" }}
      restartPolicy: Never

      # NGC image pull secret
      imagePullSecrets:
        - name: ngc-image-pull

      # NVIDIA RuntimeClass
      runtimeClassName: nvidia

      # GPU node tolerations
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: safe-synth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Job-specific command (can be overridden)
          {{- if .Values.job.command }}
          command: {{ .Values.job.command | toJson }}
          {{- end }}
          {{- if .Values.job.args }}
          args: {{ .Values.job.args | toJson }}
          {{- end }}

          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-credentials
                  key: api-key
            - name: LOG_LEVEL
              value: "INFO"
            - name: SAFE_SYNTH_MODE
              value: "local"
            - name: MODEL_CACHE_PATH
              value: "/data/models"
            # Job-specific environment
            {{- range .Values.job.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}

          resources:
            requests:
              memory: 32Gi
              cpu: 4
              nvidia.com/gpu: 1
            limits:
              memory: 64Gi
              cpu: 8
              nvidia.com/gpu: 1

          volumeMounts:
            - name: data
              mountPath: /data
            - name: input-data
              mountPath: /input
              readOnly: true
            - name: output-data
              mountPath: /output

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: safe-synth-data
        - name: input-data
          configMap:
            name: {{ .Values.job.inputConfigMap | default "safe-synth-input" }}
            optional: true
        - name: output-data
          emptyDir: {}
{{- end }}
