# Safe Synthesizer Deployment
# Configured for H200 GPU (141GB VRAM) - local inference mode
# For API-only mode (smaller GPUs), use values-api-only.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-synth
  labels:
    app: safe-synth
    app.kubernetes.io/name: safe-synth
    app.kubernetes.io/component: synthesizer
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: safe-synth
  template:
    metadata:
      labels:
        app: safe-synth
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # KAI Scheduler for GPU workloads
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: safe-synth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: config
              mountPath: /etc/safe-synth/config.yaml
              subPath: config.yaml
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: safe-synth-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: safe-synth-config
