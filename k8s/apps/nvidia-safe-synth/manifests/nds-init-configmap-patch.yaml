# Patched init ConfigMap for NDS (NeMo Data Store)
# This overrides the Helm-generated ConfigMap to fix the must-change-password bug
# Bug: Original script calls `gitea admin user change-password` without --must-change-password=false
# This causes API tokens to stop working after pod restart with "You must change your password" error
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-safe-synth-data-store-init
  namespace: nvidia-ai
  labels:
    app: data-store
    app.kubernetes.io/instance: nvidia-safe-synth
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: data-store
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # Apply after Helm chart (wave 0)
data:
  # Original scripts from Helm chart
  init_directory_structure.sh: |-
    #!/usr/bin/env bash

    set -euo pipefail

    set -x
    chown 1000:1000 /data
    mkdir -p /data/git/.ssh
    chmod -R 700 /data/git/.ssh
    mkdir -p ${GITEA_TEMP}
    chown 1000:1000 ${GITEA_TEMP}
    chmod ug+rwx ${GITEA_TEMP}

  # PATCHED: Added --must-change-password=false to the change-password command
  configure_gitea.sh: |-
    #!/usr/bin/env bash

    set -euo pipefail

    echo '==== BEGIN DATASTORE CONFIGURATION ===='

    { # try
      gitea migrate
    } || { # catch
      echo "Gitea migrate might fail due to database connection...This init-container will try again in a few seconds"
      exit 1
    }
    function configure_admin_user() {
      local full_admin_list=$(gitea admin user list --admin)
      local actual_user_table=''

      # We might have distorted output due to warning logs, so we have to detect the actual user table by its headline and trim output above that line
      local regex="(.*)(ID\s+Username\s+Email\s+IsActive.*)"
      if [[ "${full_admin_list}" =~ $regex ]]; then
        actual_user_table=$(echo "${BASH_REMATCH[2]}" | tail -n+2) # tail'ing to drop the table headline
      else
        echo "ERROR: 'configure_admin_user' was not able to determine the current list of admin users."
        echo "       Please review the output of 'gitea admin user list --admin' shown below."
        echo "DEBUG: Output of 'gitea admin user list --admin'"
        echo "--"
        echo "${full_admin_list}"
        echo "--"
        exit 1
      fi

      local ACCOUNT_ID=$(echo "${actual_user_table}" | grep -E "\s+${GITEA_ADMIN_USERNAME}\s+" | awk -F " " "{printf \$1}")
      if [[ -z "${ACCOUNT_ID}" ]]; then
        echo "No admin user '${GITEA_ADMIN_USERNAME}' found. Creating now..."
        gitea admin user create --admin --username "${GITEA_ADMIN_USERNAME}" --password "${GITEA_ADMIN_PASSWORD}" --email "datastore@local.domain" --must-change-password=false
        echo '...created.'
      else
        echo "Admin account '${GITEA_ADMIN_USERNAME}' already exist. Running update to sync password..."
        # PATCHED: Added --must-change-password=false to prevent breaking API tokens
        gitea admin user change-password --username "${GITEA_ADMIN_USERNAME}" --password "${GITEA_ADMIN_PASSWORD}" --must-change-password=false
        echo '...password sync done.'
      fi
    }

    configure_admin_user

    function configure_ldap() {
        echo 'no ldap configuration... skipping.'
    }

    configure_ldap

    function configure_oauth() {
        echo 'no oauth configuration... skipping.'
    }

    configure_oauth

    echo '==== END DATASTORE CONFIGURATION ===='

  # Original checksum script
  checksum.sh: |-
    #!/usr/bin/env bash

    set -euo pipefail

    echo "Checking if there are any new versions..."

    NEW_CHECKSUM=$(sha256sum /data/gitea/conf/app.ini | awk '{print $1}')
    OLD_CHECKSUM=$(cat /data/gitea/conf/.checksum_app_ini || echo "")

    if [[ "$NEW_CHECKSUM" != "$OLD_CHECKSUM" ]]; then
      echo "New version detected, saving checksum..."
      echo "$NEW_CHECKSUM" > /data/gitea/conf/.checksum_app_ini
    fi

    echo "Checksum check complete."
