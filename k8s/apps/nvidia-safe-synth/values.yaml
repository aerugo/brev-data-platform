# NVIDIA NeMo Safe Synthesizer Helm Chart Values
# Based on official NVIDIA documentation:
# https://docs.nvidia.com/nemo/microservices/latest/generate-private-synthetic-data/
#
# TIME-SHARING GPU STRATEGY:
# - safe-synth defaults to 0 replicas (off)
# - Scale to 1 replica when synthetic data generation is needed
# - Uses batch-high priority (130) to preempt nim-llm (125)
# - When safe-synth scales down, nim-llm auto-restarts
#
# Usage:
#   kubectl scale deployment safe-synth -n nvidia-ai --replicas=1  # Enable
#   kubectl scale deployment safe-synth -n nvidia-ai --replicas=0  # Disable
#
# IMPORTANT: Requires NGC secrets applied first:
#   ./scripts/apply-secrets.sh

# Deployment mode: local (GPU inference) or api-only
mode: local

# NeMo Safe Synthesizer container from NGC
image:
  repository: nvcr.io/nvidia/nemo-microservices/safe-synthesizer
  tag: "25.12"
  pullPolicy: IfNotPresent

# NGC image pull secret (created by apply-secrets.sh)
imagePullSecrets:
  - name: ngc-image-pull

# Default to 0 - scale up on demand to preempt nim-llm
replicaCount: 0

# GPU resources - uses full GPU when running (time-sharing, not fractional)
# Safe Synthesizer requires ~80GB VRAM
# NIM allocates full GPU memory, so this preempts nim-llm when scaled up
resources:
  requests:
    memory: 32Gi
    cpu: 4
    nvidia.com/gpu: 1
  limits:
    memory: 64Gi
    cpu: 8
    nvidia.com/gpu: 1

# Use NVIDIA RuntimeClass (created by bootstrap-rke2.sh)
runtimeClassName: nvidia

# KAI Scheduler for GPU workloads
schedulerName: kai-scheduler

# Priority class - batch-high (130) to preempt nim-llm (inference, 125)
# When scaled up, safe-synth preempts nim-llm for GPU access
priorityClassName: batch-high

# KAI Queue assignment - uses batch queue for GPU scheduling
podLabels:
  kai.scheduler/queue: batch-queue
  workload-type: batch

# Tolerations for GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Service configuration
service:
  type: ClusterIP
  port: 8080
  # API Endpoints:
  # - POST /jobs - Create synthesis job
  # - GET /jobs - List jobs
  # - GET /jobs/{job_id} - Get job status
  # - GET /jobs/{job_id}/results/{result_id}/download - Download results

# NVIDIA API configuration (backup/alternative)
api:
  # NVIDIA hosted API endpoint (used if local fails)
  baseUrl: "https://integrate.api.nvidia.com/v1"
  # Secret containing NGC API key
  secretName: ngc-credentials
  secretKey: api-key

# Environment variables
env:
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: ngc-credentials
        key: api-key
  - name: LOG_LEVEL
    value: "INFO"
  - name: SAFE_SYNTH_MODE
    value: "local"
  # Model cache location
  - name: MODEL_CACHE_PATH
    value: "/data/models"

# ConfigMap for synthesis configuration
config:
  # Default job settings
  defaultJobConfig:
    # Privacy settings (differential privacy)
    epsilon: 1.0  # Lower = more privacy, less utility
    delta: 1e-5
    piiReplacement: true

    # Generation settings
    temperature: 0.7
    maxRecords: 10000
    batchSize: 100

    # Evaluation settings (privacy attack tests)
    runMiaEvaluation: true   # Membership Inference Attack
    runAiaEvaluation: true   # Attribute Inference Attack

# Data persistence for models and job results
persistence:
  enabled: true
  size: 100Gi  # Models + intermediate data + results
  mountPath: /data
  accessMode: ReadWriteOnce

# Health probes - models take time to load
startupProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 120
  periodSeconds: 15
  failureThreshold: 40  # Allow 10 minutes for model loading

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

# Job configuration for Kubernetes Job-based synthesis
# When enabled, Safe Synth runs as a Kubernetes Job instead of Deployment
# Jobs use KAI Scheduler priority-based preemption to acquire GPU from NIM
job:
  enabled: false  # Set to true when launching via Dagster
  runId: ""       # Unique identifier from Dagster run
  priorityClassName: batch-high  # Value 130 > inference (125) for preemption
  command: []     # Override container command if needed
  args: []        # Override container args if needed
  env: []         # Additional environment variables
  inputConfigMap: ""  # ConfigMap with input data (optional)
