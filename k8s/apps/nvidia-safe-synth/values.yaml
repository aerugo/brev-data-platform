# NVIDIA NeMo Safe Synthesizer Helm Chart Values
# Uses official NVIDIA nemo-microservices-helm-chart from NGC
# https://docs.nvidia.com/nemo/microservices/latest/generate-private-synthetic-data/
#
# CO-INFERENCE GPU STRATEGY:
# - safe-synth runs always-on (replicaCount=1) alongside nim-llm
# - KAI fractional GPU allocation: safe-synth 40Gi + nim-llm 25Gi = 65Gi << 141Gi H200
# - Both services coexist in inference-queue
# - No manual scaling needed (fixes INV-N007, INV-G003)

# Only install Safe Synthesizer, not full platform
tags:
  platform: false
  safe-synthesizer: true

# Use existing NGC secrets from nvidia-ai namespace
existingSecret: ngc-credentials
existingImagePullSecret: ngc-image-pull

# Global settings
global:
  imagePullSecrets:
    - name: ngc-image-pull

# Core platform configuration
core:
  config:
    platform:
      # Disable service account auth for easier API access
      enable_service_account_auth: false

  # Job storage PVC — chart defaults to ReadWriteMany (requires NFS).
  # Single-node cluster only has local-path (ReadWriteOnce).
  storage:
    accessModes:
      - ReadWriteOnce
    size: 50Gi

# Safe Synthesizer configuration
safe-synthesizer:
  # Always-on: coexists with nim-llm via KAI fractional GPU allocation
  replicaCount: 1

  # Service name matches what Dagster expects
  serviceName: nemo-safe-synthesizer

  # LLM configuration - use our nim-llm for classification
  config:
    # Point to our local NIM LLM service for classification
    classify_llm_endpoint_url: http://nim-llm.nvidia-ai.svc.cluster.local:8000/v1
    classify_llm_model_id: meta/llama-3.1-8b-instruct

  # No external API key needed - using local NIM
  classify:
    apiKey: "not-needed-local"

  # Image pull secrets
  imagePullSecrets:
    - name: ngc-image-pull

  # Pod labels for KAI scheduler
  podLabels:
    kai.scheduler/queue: inference-queue
    workload-type: inference

  # Pod annotations for KAI GPU memory allocation
  podAnnotations:
    kai.scheduler.nvidia.com/gpu-memory: "40Gi"

  # Service configuration
  service:
    type: ClusterIP
    port: 8000

  # Resource configuration for GPU workloads
  resources:
    requests:
      memory: 32Gi
      cpu: 4
    limits:
      memory: 64Gi
      cpu: 8

  # Health probes - models take time to load
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# Data Store (Gitea) configuration for dataset management
# This stores datasets used by Safe Synthesizer
data-store:
  enabled: true

  # Admin user configuration
  # NOTE: The chart's init script has a bug where password sync doesn't set
  # --must-change-password=false, breaking API tokens on pod restart.
  # We work around this with a post-sync Job (see templates/nds-admin-fix-job.yaml)
  gitea:
    admin:
      username: datastore_admin
      password: s3aJPHD9!bt6d0I
      email: datastore@local.domain

# PostgreSQL for job persistence (included in chart)
postgresql:
  enabled: true
  auth:
    postgresPassword: "safe-synth-postgres"
    database: "safe_synthesizer"
  primary:
    persistence:
      enabled: true
      size: 10Gi
