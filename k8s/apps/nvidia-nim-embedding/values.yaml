# NVIDIA NIM Embedding Model Configuration
# Model: nv-embedqa-e5-v5 (1024 dimensions)
#
# E5-based embedding model optimized for question-answering retrieval.
# It shares the GPU with the LLM NIM via KAI Scheduler fractional allocation.

# Container image
# Using nv-embedqa-e5-v5 - E5-based model with broader NGC access
# Alternative: llama-3_2-nemoretriever-300m-embed-v2 (requires additional NGC license)
image:
  repository: nvcr.io/nim/nvidia/nv-embedqa-e5-v5
  tag: "1.3.0"
  pullPolicy: IfNotPresent

# NGC image pull secret
imagePullSecrets:
  - name: ngc-image-pull

# Replica count (single instance for development)
replicaCount: 1

# Service configuration
service:
  type: ClusterIP
  port: 8000
  annotations: {}

# Resource allocation
# 300M model uses ~1GB GPU memory, minimal CPU
resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "2"
    memory: "4Gi"
    nvidia.com/gpu: "1"

# KAI Scheduler configuration
schedulerName: kai-scheduler

# Queue assignment - shares inference queue with LLM NIM
podLabels:
  kai.scheduler/queue: inference-queue

# GPU memory annotation for KAI (fractional allocation)
podAnnotations:
  kai.scheduler.nvidia.com/gpu-memory: "2Gi"

# Priority class - preemptible to allow over-quota GPU sharing with LLM NIM
# Uses build-preemptible (75) instead of inference (125) so it can be
# preempted if needed, but will run alongside LLM via KAI fractional allocation
priorityClassName: build-preemptible

# Environment variables
env:
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: ngc-credentials
        key: api-key
  - name: NIM_CACHE_PATH
    value: "/opt/nim/.cache"
  - name: NIM_LOG_LEVEL
    value: "INFO"

# Volume for model cache
persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# Health checks
livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# GPU node tolerations
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Node selector (optional - run on GPU node)
nodeSelector: {}

# NVIDIA RuntimeClass
runtimeClassName: nvidia

# Service account
serviceAccount:
  create: true
  name: nvidia-nim-embedding

# Pod security context
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsNonRoot: true
