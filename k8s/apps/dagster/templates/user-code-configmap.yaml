apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-user-code
  labels:
    app: dagster
data:
  definitions.py: |
    """Minimal Dagster user code for Brev Data Platform.

    This is a placeholder that will be replaced with actual assets
    from the dagster/ directory in the repository.
    """
    import dagster as dg

    @dg.asset
    def hello_world(context: dg.AssetExecutionContext) -> str:
        """A simple hello world asset."""
        context.log.info("Hello from Brev Data Platform!")
        return "Hello, World!"

    @dg.asset
    def platform_info(context: dg.AssetExecutionContext, hello_world: str) -> dict:
        """Return platform information."""
        import os
        info = {
            "message": hello_world,
            "hostname": os.environ.get("HOSTNAME", "unknown"),
            "namespace": os.environ.get("DAGSTER_K8S_NAMESPACE", "dagster"),
        }
        context.log.info(f"Platform info: {info}")
        return info

    defs = dg.Definitions(
        assets=[hello_world, platform_info],
    )
