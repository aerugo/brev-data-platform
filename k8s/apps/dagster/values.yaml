# Dagster Helm Chart Values
# Uses the official Dagster Helm chart as a dependency

dagster:
  # PostgreSQL for Dagster storage
  postgresql:
    enabled: true
    postgresqlUsername: dagster
    postgresqlPassword: dagster
    postgresqlDatabase: dagster

  # Dagster webserver (UI)
  dagsterWebserver:
    replicaCount: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    service:
      type: ClusterIP
      port: 80

  # Dagster daemon (schedules, sensors, run queue)
  dagsterDaemon:
    enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  # Run launcher configuration
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        imagePullPolicy: Always
        loadInclusterConfig: true

  # User code deployments with custom code mounted from ConfigMap
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: "brev-user-code"
        image:
          # Use dagster-celery-k8s which has all dependencies
          repository: "docker.io/dagster/dagster-celery-k8s"
          tag: ~
          pullPolicy: Always
        dagsterApiGrpcArgs:
          - "--python-file"
          - "/opt/dagster/user-code/definitions.py"
        port: 3030
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        # Mount our ConfigMap with the user code
        volumes:
          - name: user-code
            configMap:
              name: dagster-user-code
        volumeMounts:
          - name: user-code
            mountPath: /opt/dagster/user-code
            readOnly: true
