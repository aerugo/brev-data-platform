# Dagster Helm Chart Values
# Uses the official Dagster Helm chart as a dependency

dagster:
  # PostgreSQL for Dagster storage
  postgresql:
    enabled: true
    postgresqlUsername: dagster
    postgresqlPassword: dagster
    postgresqlDatabase: dagster

  # Dagster webserver (UI)
  dagsterWebserver:
    replicaCount: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    service:
      type: ClusterIP
      port: 80

  # Dagster daemon (schedules, sensors, run queue)
  dagsterDaemon:
    enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  # Run launcher configuration
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        imagePullPolicy: Always
        loadInclusterConfig: true
        # Higher memory limits for run workers processing full datasets
        runK8sConfig:
          containerConfig:
            resources:
              requests:
                memory: 2Gi
                cpu: 500m
              limits:
                memory: 4Gi
                cpu: 2000m

  # User code deployments with custom image from GHCR
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: "brev-pipelines"
        image:
          repository: "ghcr.io/aerugo/brev-data-platform/dagster"
          tag: "v20260127134836"
          pullPolicy: Never
        dagsterApiGrpcArgs:
          - "--module-name"
          - "brev_pipelines.definitions"
        port: 4000
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2000m
        envSecrets:
          - name: dagster-env-secrets
          - name: nds-credentials
        env:
          # NDS (NeMo Data Store) configuration for Safe Synthesizer
          - name: NDS_ENDPOINT
            value: "http://nemo-data-store.nvidia-ai.svc.cluster.local:3000"
          - name: NDS_REPO
            value: "admin/central-bank-speeches"
          # Safe Synthesizer configuration
          - name: SAFE_SYNTH_ENDPOINT
            value: "http://nemo-safe-synthesizer.nvidia-ai.svc.cluster.local:8000"
