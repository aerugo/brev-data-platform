# Dagster Helm Chart Values
# Uses the official Dagster Helm chart as a dependency

dagster:
  global:
    # App version for image tags
    appVersion: "1.12.11"

  # PostgreSQL for Dagster storage
  postgresql:
    enabled: true
    postgresqlUsername: dagster
    postgresqlPassword: dagster
    postgresqlDatabase: dagster

  # Dagster webserver (UI)
  dagsterWebserver:
    replicaCount: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    service:
      type: ClusterIP
      port: 80
    # Configure workspace to use our external ConfigMap
    workspace:
      enabled: true
      externalConfigmap: dagster-workspace

  # Dagster daemon (schedules, sensors, run queue)
  dagsterDaemon:
    enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  # Run launcher configuration
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        imagePullPolicy: Always
        loadInclusterConfig: true

  # Disable the built-in user-deployments subchart
  # We manage our own user code deployment via templates
  dagster-user-deployments:
    enabled: false
    enableSubchart: false
