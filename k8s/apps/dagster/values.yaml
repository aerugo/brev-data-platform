# Dagster Helm Chart Values
# Uses the official Dagster Helm chart as a dependency

dagster:
  # PostgreSQL for Dagster storage
  postgresql:
    enabled: true
    postgresqlUsername: dagster
    postgresqlPassword: dagster
    postgresqlDatabase: dagster

  # Dagster webserver (UI)
  dagsterWebserver:
    replicaCount: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    service:
      type: ClusterIP
      port: 80

  # Dagster daemon (schedules, sensors, run queue)
  dagsterDaemon:
    enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    runCoordinator:
      enabled: true
      type: QueuedRunCoordinator
      config:
        queuedRunCoordinator:
          maxConcurrentRuns: 10

  # Run launcher configuration
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        imagePullPolicy: Always
        loadInclusterConfig: true

  # User code deployments - enabled with default example
  # Will be replaced with custom user code later
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: "k8s-example-user-code-1"
        image:
          repository: "docker.io/dagster/user-code-example"
          tag: ~
          pullPolicy: Always
        dagsterApiGrpcArgs:
          - "--python-file"
          - "/iris_analysis/definitions.py"
        port: 3030
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
