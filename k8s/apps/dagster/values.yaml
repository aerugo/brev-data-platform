# Dagster Helm Chart Values
# Uses the official Dagster Helm chart as a dependency

dagster:
  # PostgreSQL for Dagster storage
  postgresql:
    enabled: true
    postgresqlUsername: dagster
    postgresqlPassword: dagster
    postgresqlDatabase: dagster

  # Dagster webserver (UI)
  dagsterWebserver:
    replicaCount: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    service:
      type: ClusterIP
      port: 80

  # Dagster daemon (schedules, sensors, run queue)
  dagsterDaemon:
    enabled: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  # Run launcher configuration
  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        imagePullPolicy: Always
        loadInclusterConfig: true

  # User code deployments with custom image from GHCR
  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    deployments:
      - name: "brev-pipelines"
        image:
          repository: "ghcr.io/aerugo/brev-dagster-pipelines"
          tag: "latest"
          pullPolicy: Always
        dagsterApiGrpcArgs:
          - "--module-name"
          - "brev_pipelines.definitions"
        port: 4000
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
        envFrom:
          - secretRef:
              name: dagster-env-secrets
