apiVersion: v1
kind: Service
metadata:
  name: nim-reasoning
  labels:
    app: nim-reasoning
    app.kubernetes.io/name: nim-reasoning
    app.kubernetes.io/component: inference
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: nim-reasoning
