{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nim-reasoning
  labels:
    app: nim-reasoning
    app.kubernetes.io/name: nim-reasoning
    app.kubernetes.io/component: inference
    {{- with .Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: nim-reasoning
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /v1/metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: 10s
{{- end }}
