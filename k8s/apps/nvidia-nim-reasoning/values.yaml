# NVIDIA NIM Reasoning Model (GPT-OSS-120B) Configuration
#
# GPT-OSS-120B is a Mixture-of-Experts reasoning model:
# - 117B total parameters, ~5.1B active per inference
# - Designed to fit within 80GB GPU (MXFP4 quantization)
# - Configurable reasoning effort (low/medium/high)
# - 128K context window
#
# DAGSTER-MANAGED GPU SCALING:
# - nim-reasoning defaults to 0 replicas (off)
# - Dagster's K8sScalerResource scales it up when reasoning is needed
# - Dagster scales down safe-synth before scaling up nim-reasoning
#   (80Gi + 25Gi + 40Gi + 2Gi = 147Gi > 141Gi available)
# - nim-reasoning coexists with nim-llm + nim-embedding (80 + 25 + 2 = 107Gi)
# - When nim-reasoning scales down, Dagster restores safe-synth to 1
#
# IMPORTANT: Never scale manually via kubectl! All scaling is managed
# by Dagster's K8sScalerResource for graceful transitions.
#
# IMPORTANT: Requires NGC secrets applied first:
#   ./scripts/apply-secrets.sh

# Container image - GPT-OSS-120B via NVIDIA NIM
image:
  repository: nvcr.io/nim/openai/gpt-oss-120b
  tag: "latest"
  pullPolicy: Always

# NGC image pull secret (created by apply-secrets.sh)
imagePullSecrets:
  - name: ngc-image-pull

# Default to 0 - Dagster scales up on demand (scaling down safe-synth first)
replicaCount: 0

# GPU resources - GPT-OSS-120B MoE with MXFP4 quantization
# Needs ~80GB VRAM; coexists with nim-llm (25Gi) + nim-embedding (2Gi)
# Cannot coexist with safe-synth simultaneously (107 + 40 = 147 > 141)
resources:
  requests:
    memory: 96Gi
    cpu: 4
    nvidia.com/gpu: 1
  limits:
    memory: 128Gi
    cpu: 8
    nvidia.com/gpu: 1

# Use NVIDIA RuntimeClass (created by bootstrap-rke2.sh)
runtimeClassName: nvidia

# KAI Scheduler for GPU workloads
# Enables fractional GPU, gang scheduling, and topology-aware placement
schedulerName: kai-scheduler

# KAI Queue assignment - uses inference queue for GPU scheduling
podLabels:
  kai.scheduler/queue: inference-queue
  model-type: reasoning

# Priority class - inference (125) for NIM workloads
priorityClassName: inference

# KAI Scheduler annotations for GPU allocation
# GPT-OSS-120B MoE needs ~80Gi with MXFP4 quantization (TP=1)
# 80Gi allows coexistence with nim-llm (25Gi) + nim-embedding (2Gi) = 107Gi total
podAnnotations:
  kai.scheduler.nvidia.com/gpu-memory: "80Gi"

# Tolerations for GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Service configuration
service:
  type: ClusterIP
  port: 8000
  # OpenAI-compatible endpoint at /v1/chat/completions
  # Prometheus scraping annotations
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/v1/metrics"

# Observability configuration
observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring

# Environment variables per NVIDIA docs
env:
  # NGC API key for model downloads
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: ngc-credentials
        key: api-key
  # Force single-GPU TP=1 profile for H200 (vllm-mxfp4-tp1-pp1)
  # This profile uses vLLM backend with MXFP4 quantization on 1 GPU
  - name: NIM_MODEL_PROFILE
    value: "fc1df044c94b466d0ebd561df47556bc23a01ac8147d68dc49f04238a6cfcd7f"
  # Model cache location
  - name: NIM_CACHE_PATH
    value: "/opt/nim/.cache"
  # Logging level
  - name: NIM_LOG_LEVEL
    value: "INFO"
  # Observability - Prometheus metrics endpoint
  - name: NIM_ENABLE_METRICS
    value: "true"
  # Observability - Log prompts and responses
  - name: NIM_LOG_REQUESTS
    value: "true"
  # OpenTelemetry service name
  - name: OTEL_SERVICE_NAME
    value: "nim-reasoning"

# Model cache persistence
# GPT-OSS-120B model weights are ~60GB quantized
persistence:
  enabled: true
  size: 100Gi
  mountPath: /opt/nim/.cache
  accessMode: ReadWriteOnce

# Health probes - MoE models load faster than dense models of similar quality
startupProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 120
  periodSeconds: 15
  failureThreshold: 40  # Allow 10 minutes for model loading

livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
