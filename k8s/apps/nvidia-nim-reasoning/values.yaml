# NVIDIA NIM Reasoning Model (GPT-OSS-120B) Configuration
#
# GPT-OSS-120B is a Mixture-of-Experts reasoning model:
# - 117B total parameters, ~5.1B active per inference
# - Designed to fit within 80GB GPU (MXFP4 quantization)
# - Configurable reasoning effort (low/medium/high)
# - 128K context window
#
# TIME-SHARING GPU STRATEGY:
# - nim-reasoning defaults to 0 replicas (off)
# - Scale to 1 replica when reasoning is needed
# - Uses batch-high priority (130) to preempt nim-llm (125)
# - When nim-reasoning scales down, nim-llm auto-restarts
#
# Usage:
#   kubectl scale deployment nim-reasoning -n nvidia-ai --replicas=1  # Enable
#   kubectl scale deployment nim-reasoning -n nvidia-ai --replicas=0  # Disable
#
# IMPORTANT: Requires NGC secrets applied first:
#   ./scripts/apply-secrets.sh

# Container image - GPT-OSS-120B via NVIDIA NIM
image:
  repository: nvcr.io/nim/openai/gpt-oss-120b
  tag: "latest"
  pullPolicy: Always

# NGC image pull secret (created by apply-secrets.sh)
imagePullSecrets:
  - name: ngc-image-pull

# Default to 0 - scale up on demand to preempt nim-llm
replicaCount: 0

# GPU resources - uses full GPU when running (time-sharing, not fractional)
# GPT-OSS-120B needs ~80GB VRAM (MoE with MXFP4 quantization)
# NIM allocates full GPU memory, so this preempts nim-llm when scaled up
resources:
  requests:
    memory: 96Gi
    cpu: 4
    nvidia.com/gpu: 1
  limits:
    memory: 128Gi
    cpu: 8
    nvidia.com/gpu: 1

# Use NVIDIA RuntimeClass (created by bootstrap-rke2.sh)
runtimeClassName: nvidia

# KAI Scheduler for GPU workloads
# Enables fractional GPU, gang scheduling, and topology-aware placement
schedulerName: kai-scheduler

# KAI Queue assignment - uses inference queue for GPU scheduling
podLabels:
  kai.scheduler/queue: inference-queue
  model-type: reasoning

# Priority class - batch-high (130) to preempt nim-llm (inference, 125)
# When scaled up, nim-reasoning preempts nim-llm for GPU access
priorityClassName: batch-high

# KAI Scheduler annotations for fractional GPU allocation
# Requests 80GB of GPU memory for GPT-OSS-120B
podAnnotations:
  kai.scheduler.nvidia.com/gpu-memory: "80Gi"

# Tolerations for GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

# Service configuration
service:
  type: ClusterIP
  port: 8000
  # OpenAI-compatible endpoint at /v1/chat/completions
  # Prometheus scraping annotations
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/v1/metrics"

# Observability configuration
observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring

# Environment variables per NVIDIA docs
env:
  # NGC API key for model downloads
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: ngc-credentials
        key: api-key
  # Model profile for H200 GPU (avoids ambiguous profile selection)
  - name: NIM_MODEL_PROFILE
    value: "2dd16f3190c2e0d4250be2b65f8cf8f5acc9429d03aaddfb02e11f889e2973eb"
  # Model cache location
  - name: NIM_CACHE_PATH
    value: "/opt/nim/.cache"
  # Logging level
  - name: NIM_LOG_LEVEL
    value: "INFO"
  # Observability - Prometheus metrics endpoint
  - name: NIM_ENABLE_METRICS
    value: "true"
  # Observability - Log prompts and responses
  - name: NIM_LOG_REQUESTS
    value: "true"
  # OpenTelemetry service name
  - name: OTEL_SERVICE_NAME
    value: "nim-reasoning"

# Model cache persistence
# GPT-OSS-120B model weights are ~60GB quantized
persistence:
  enabled: true
  size: 100Gi
  mountPath: /opt/nim/.cache
  accessMode: ReadWriteOnce

# Health probes - MoE models load faster than dense models of similar quality
startupProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 120
  periodSeconds: 15
  failureThreshold: 40  # Allow 10 minutes for model loading

livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
