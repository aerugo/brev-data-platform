# KAI Scheduler Queue Configuration
# Hierarchical queues for GPU workload scheduling
#
# Queue Hierarchy:
#   default-parent-queue (cluster-level)
#   ├── inference-queue (NIM LLM, NIM Reasoning, NIM Embedding, Safe Synthesizer)
#   ├── batch-queue (training jobs)
#   └── default-queue (backwards compatibility)
#
# GPU Memory Budget (H200 141GB):
#   - Llama 8B (nim-llm): 25Gi KAI annotation
#   - Safe Synth TinyLlama 1.1B: 40Gi KAI annotation
#   - Embedding (nim-embedding): 2Gi KAI annotation
#   - GPT-OSS-120B (nim-reasoning): 80Gi KAI annotation
#   - Default concurrent (no reasoning): 67Gi << 141Gi
#   - With reasoning (no safe-synth): 80 + 25 + 2 = 107Gi < 141Gi
#   - All four: 80 + 25 + 40 + 2 = 147Gi > 141Gi (cannot coexist)
#
# GPU Orchestration Strategy:
# - nim-llm + Safe Synth + nim-embedding coexist via fractional GPU (67Gi)
# - nim-reasoning coexists with nim-llm + nim-embedding (107Gi)
# - Dagster scales safe-synth down when nim-reasoning scales up (and vice versa)
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: default-parent-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  resources:
    # Total CPU available for GPU workloads
    cpu:
      quota: 12000  # 12 cores (node has 12, ~4 used by system)
      limit: -1     # No upper limit (overcommit allowed)
      overQuotaWeight: 1
    # Total GPU available (quota counts GPU requests, not physical GPUs)
    gpu:
      quota: 3      # Allow 3 fractional GPU requests on 1 H200
      limit: -1
      overQuotaWeight: 1
    # Total memory available for GPU workloads
    memory:
      quota: 120000000000  # ~120GB (node has ~120GB allocatable)
      limit: -1
      overQuotaWeight: 1
---
# Inference Queue - For always-on GPU services (NIM LLM, Reasoning, Embedding)
# All NIM services share the GPU via KAI fractional allocation
# Over-quota workloads become preemptible (higher priority preempts lower)
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: inference-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  parentQueue: default-parent-queue
  # Priority determines resource allocation order
  priority: 100
  resources:
    cpu:
      quota: 12000
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: 4      # Allow 4 non-preemptible inference pods (LLM, Safe Synth, Embedding, Reasoning)
      limit: 4      # Allow up to 4 GPU requests via fractional allocation
      overQuotaWeight: 1  # Over-quota pods are preemptible
    memory:
      quota: 110000000000  # ~110GB for all inference models
      limit: -1
      overQuotaWeight: 1
---
# Batch Queue - For batch jobs (Safe Synthesizer, training)
# Quota allows scheduling, priority-based preemption handles GPU access
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: batch-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  parentQueue: default-parent-queue
  # Lower queue priority, but batch-high pods (130) preempt inference (125)
  priority: 50
  resources:
    cpu:
      quota: 8000
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: 1      # Allow 1 batch GPU workload (safe-synth or training)
      limit: 1      # Can use full GPU
      overQuotaWeight: 1
    memory:
      quota: 80000000000
      limit: -1
      overQuotaWeight: 1
---
# Keep default-queue for backwards compatibility
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: default-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  parentQueue: default-parent-queue
  resources:
    cpu:
      quota: 12000
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: 1
      limit: -1
      overQuotaWeight: 1
    memory:
      quota: 120000000000
      limit: -1
      overQuotaWeight: 1
