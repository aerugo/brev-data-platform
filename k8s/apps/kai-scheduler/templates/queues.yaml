# KAI Scheduler Queue Configuration
# Hierarchical queues for GPU workload scheduling
#
# Queue Hierarchy:
#   default-parent-queue (cluster-level)
#   ├── inference-queue (NIM LLM, NIM Reasoning, NIM Embedding)
#   ├── batch-queue (Safe Synthesizer, training jobs)
#   └── default-queue (backwards compatibility)
#
# GPU Memory Budget (H200 141GB):
#   - Llama 8B (nim-llm): 25GB
#   - GPT-OSS-120B (nim-reasoning): 80GB
#   - Embedding (nim-embedding): 2GB
#   - Total inference: 107GB
#   - Remaining for JupyterHub/batch: 34GB
#
# GPU Orchestration Strategy:
# - All NIM services run in inference-queue with priority 100
# - KAI fractional allocation manages GPU memory per-pod
# - Safe Synthesizer runs in batch-queue with priority 50
# - When batch-high priority (130) jobs submit, they preempt inference
# - After job completion, NIM Deployments automatically restart
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: default-parent-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  resources:
    # Total CPU available for GPU workloads
    cpu:
      quota: 12000  # 12 cores (node has 12, ~4 used by system)
      limit: -1     # No upper limit (overcommit allowed)
      overQuotaWeight: 1
    # Total GPU available (quota counts GPU requests, not physical GPUs)
    gpu:
      quota: 3      # Allow 3 fractional GPU requests on 1 H200
      limit: -1
      overQuotaWeight: 1
    # Total memory available for GPU workloads
    memory:
      quota: 120000000000  # ~120GB (node has ~120GB allocatable)
      limit: -1
      overQuotaWeight: 1
---
# Inference Queue - For always-on GPU services (NIM LLM, Reasoning, Embedding)
# All NIM services share the GPU via KAI fractional allocation
# Over-quota workloads become preemptible (higher priority preempts lower)
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: inference-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  parentQueue: default-parent-queue
  # Priority determines resource allocation order
  priority: 100
  resources:
    cpu:
      quota: 12000
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: 3      # Allow 3 non-preemptible inference pods (LLM, Reasoning, Embedding)
      limit: 3      # Allow up to 3 GPU requests via fractional allocation
      overQuotaWeight: 1  # Over-quota pods are preemptible
    memory:
      quota: 110000000000  # ~110GB for all inference models
      limit: -1
      overQuotaWeight: 1
---
# Batch Queue - For batch jobs (Safe Synthesizer, training)
# Zero quota, borrows from inference-queue via preemption
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: batch-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  parentQueue: default-parent-queue
  # Lower priority, but can preempt via priority classes
  priority: 50
  resources:
    cpu:
      quota: 8000
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: 0      # No guaranteed quota
      limit: 1      # Can use full GPU when available
      overQuotaWeight: 1  # Can borrow unused resources
    memory:
      quota: 80000000000
      limit: -1
      overQuotaWeight: 1
---
# Keep default-queue for backwards compatibility
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: default-queue
  annotations:
    helm.sh/resource-policy: keep
spec:
  parentQueue: default-parent-queue
  resources:
    cpu:
      quota: 12000
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: 1
      limit: -1
      overQuotaWeight: 1
    memory:
      quota: 120000000000
      limit: -1
      overQuotaWeight: 1
