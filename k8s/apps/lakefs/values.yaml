# LakeFS Helm Chart Values
# Uses the official LakeFS Helm chart as a dependency

lakefs:
  # LakeFS configuration
  lakefsConfig: |
    database:
      type: local
      local:
        path: /lakefs/data/lakefs.db
    blockstore:
      type: s3
      s3:
        endpoint: http://minio.minio.svc.cluster.local:9000
        force_path_style: true
        discover_bucket_region: false
        credentials:
          access_key_id: $(AWS_ACCESS_KEY_ID)
          secret_access_key: $(AWS_SECRET_ACCESS_KEY)
    auth:
      encrypt:
        secret_key: "a]$u9Yv-<M(5%dQh"

  # Environment variables for S3/MinIO credentials
  extraEnvVars:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootUser
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootPassword

  # Persistent volume for local database
  extraVolumes:
    - name: lakefs-data
      persistentVolumeClaim:
        claimName: lakefs-data

  extraVolumeMounts:
    - name: lakefs-data
      mountPath: /lakefs/data

  # Resource limits (INV-K002)
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Service configuration
  service:
    type: ClusterIP
    port: 8000

  # Use existing secret for credentials
  existingSecret: lakefs-credentials
