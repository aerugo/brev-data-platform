# LakeFS Helm Chart Values
# Uses the official LakeFS Helm chart as a dependency

# Repository auto-setup configuration
repository:
  # Whether to auto-create repository on setup
  enabled: true
  # Repository name in LakeFS
  name: data
  # Default branch (created with repository)
  defaultBranch: main
  # Storage location in MinIO (s3://bucket/path)
  storageNamespace: s3://lakefs/data
  # Additional branches to create after repository
  branches:
    - staging

lakefs:
  # LakeFS configuration
  # Note: S3 credentials are set via LAKEFS_BLOCKSTORE_S3_CREDENTIALS_* env vars below
  lakefsConfig: |
    database:
      type: local
      local:
        path: /lakefs/data/lakefs.db
    blockstore:
      type: s3
      s3:
        endpoint: http://minio.minio.svc.cluster.local:9000
        force_path_style: true
        discover_bucket_region: false
    auth:
      encrypt:
        secret_key: "a]$u9Yv-<M(5%dQh"

  # Environment variables for S3/MinIO credentials
  # LakeFS uses LAKEFS_ prefixed env vars to override config
  extraEnvVars:
    - name: LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootUser
    - name: LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: rootPassword

  # Persistent volume for local database
  extraVolumes:
    - name: lakefs-data
      persistentVolumeClaim:
        claimName: lakefs-data

  extraVolumeMounts:
    - name: lakefs-data
      mountPath: /lakefs/data

  # Resource limits (INV-K002)
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # Service configuration
  service:
    type: ClusterIP
    port: 8000

  # Use existing secret for credentials
  existingSecret: lakefs-credentials
