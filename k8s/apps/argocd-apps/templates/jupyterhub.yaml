# JupyterHub Application - Multi-user Notebooks with Marimo
# Sync Wave 2: Platform Layer (replaces standalone Marimo)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupyterhub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Argo Image Updater annotations for automatic image updates
    # Monitor ghcr.io/aerugo/jupyterhub-singleuser:latest and update on new digest
    argocd-image-updater.argoproj.io/image-list: singleuser=ghcr.io/aerugo/jupyterhub-singleuser:latest
    argocd-image-updater.argoproj.io/singleuser.update-strategy: newest-build
    argocd-image-updater.argoproj.io/singleuser.helm.image-name: jupyterhub.singleuser.image.name
    argocd-image-updater.argoproj.io/singleuser.helm.image-tag: jupyterhub.singleuser.image.tag
    argocd-image-updater.argoproj.io/singleuser.force-update: "true"
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aerugo/brev-data-platform.git
    targetRevision: main
    path: k8s/apps/jupyterhub
  destination:
    server: https://kubernetes.default.svc
    namespace: jupyterhub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
