# NVIDIA NIM Embedding Application - Embedding Model
# Sync Wave 3: AI Layer (with LLM NIM)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-nim-embedding
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aerugo/brev-data-platform.git
    targetRevision: main
    path: k8s/apps/nvidia-nim-embedding
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-nim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
