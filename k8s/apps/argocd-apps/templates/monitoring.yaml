# Monitoring Application - Observability Stack
# Sync Wave 1: Alongside Storage Layer (to monitor everything from the start)
# Components: Prometheus, Grafana, Loki, Promtail, DCGM Exporter
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aerugo/brev-data-platform.git
    targetRevision: main
    path: k8s/apps/monitoring
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
