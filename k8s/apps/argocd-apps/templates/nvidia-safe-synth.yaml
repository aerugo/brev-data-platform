# NVIDIA Safe Synthesizer Application - Synthetic Data Generation
# Uses NVIDIA's official NeMo Microservices Helm Chart from NGC
# Sync Wave 3: AI Layer
#
# NOTE: ignoreDifferences ignores Helm-generated secrets (random values on each render)
# and the WaitForFirstConsumer PVC that stays Pending until a jobstep pod uses it.
#
# Chart: nemo-microservices-helm-chart from NGC
# Only safe-synthesizer tag is enabled (not the full platform)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-safe-synth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multiple sources: NGC Helm chart + values + config patches from our repo
  sources:
    - repoURL: https://helm.ngc.nvidia.com/nvidia/nemo-microservices
      chart: nemo-microservices-helm-chart
      targetRevision: 25.12.0
      helm:
        valueFiles:
          - $values/k8s/apps/nvidia-safe-synth/values.yaml
    - repoURL: https://github.com/aerugo/brev-data-platform.git
      targetRevision: main
      ref: values
    # Raw manifests to patch Helm chart bugs (e.g., must-change-password fix)
    - repoURL: https://github.com/aerugo/brev-data-platform.git
      targetRevision: main
      path: k8s/apps/nvidia-safe-synth/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-ai
  # Ignore diffs that cause perpetual OutOfSync:
  # - Secrets: Helm generates random values on each render
  # - PVC: Chart specifies ReadWriteMany but we patch to ReadWriteOnce (no NFS)
  # - Deployment replicas: Dagster scales safe-synth down during nim-reasoning phases
  #   (80Gi + 25Gi + 40Gi + 2Gi = 147Gi > 141Gi available on H200)
  ignoreDifferences:
    - kind: Secret
      name: nvidia-safe-synth-data-store--lfs-jwt
      jsonPointers:
        - /data
    - kind: Secret
      name: nvidia-safe-synth-postgresql
      jsonPointers:
        - /data
    - kind: PersistentVolumeClaim
      name: nvidia-safe-synth-core-job-storage
      jqPathExpressions:
        - .spec.accessModes
    - group: apps
      kind: Deployment
      name: nvidia-safe-synth-safe-synthesizer
      jqPathExpressions:
        - .spec.replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
