# NVIDIA Safe Synthesizer Application - Synthetic Data Generation
# Uses NVIDIA's official NeMo Microservices Helm Chart from NGC
# Sync Wave 3: AI Layer
#
# NOTE: ignoreDifferences allows Dagster to scale replicas without ArgoCD reverting.
# The SafeSynthesizerResource scales 0->1 for synthesis, then back to 0.
#
# Chart: nemo-microservices-helm-chart from NGC
# Only safe-synthesizer tag is enabled (not the full platform)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-safe-synth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multiple sources: NGC Helm chart + values + config patches from our repo
  sources:
    - repoURL: https://helm.ngc.nvidia.com/nvidia/nemo-microservices
      chart: nemo-microservices-helm-chart
      targetRevision: 25.12.0
      helm:
        valueFiles:
          - $values/k8s/apps/nvidia-safe-synth/values.yaml
    - repoURL: https://github.com/aerugo/brev-data-platform.git
      targetRevision: main
      ref: values
    # Raw manifests to patch Helm chart bugs (e.g., must-change-password fix)
    - repoURL: https://github.com/aerugo/brev-data-platform.git
      targetRevision: main
      path: k8s/apps/nvidia-safe-synth/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-ai
  # Allow Dagster to control replica count without ArgoCD reverting
  # Also ignore ConfigMap data differences since we patch the init script
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: ConfigMap
      name: nvidia-safe-synth-data-store-init
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
