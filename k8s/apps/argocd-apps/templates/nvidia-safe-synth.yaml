# NVIDIA Safe Synthesizer Application - Synthetic Data Generation
# Sync Wave 3: AI Layer
#
# NOTE: ignoreDifferences allows Dagster to scale replicas without ArgoCD reverting.
# The SafeSynthesizerResource scales 0->1 for synthesis, then back to 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-safe-synth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aerugo/brev-data-platform.git
    targetRevision: main
    path: k8s/apps/nvidia-safe-synth
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-ai
  # Allow Dagster to control replica count without ArgoCD reverting
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
