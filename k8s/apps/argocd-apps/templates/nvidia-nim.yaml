# NVIDIA NIM Application - LLM Inference
# Sync Wave 3: AI Layer
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-nim
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aerugo/brev-data-platform.git
    targetRevision: main
    path: k8s/apps/nvidia-nim
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-ai
  # Ignore replica diffs: Dagster scales nim-llm to 0 during Safe Synthesizer
  # synthesis (INV-N004: nim-llm 25Gi + safe-synth 40Gi must coexist on H200 141Gi)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: nim-llm
      jqPathExpressions:
        - .spec.replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
