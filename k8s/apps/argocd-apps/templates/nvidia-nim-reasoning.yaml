# NVIDIA NIM Reasoning Model (GPT-OSS-120B) Application
# Sync Wave 3: AI Layer (same as other NIM services)
#
# NOTE: ignoreDifferences allows manual/automated scaling without ArgoCD reverting.
# GPU time-sharing: scale 0->1 to preempt nim-llm, then back to 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-nim-reasoning
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aerugo/brev-data-platform.git
    targetRevision: main
    path: k8s/apps/nvidia-nim-reasoning
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-ai
  # Allow manual scaling for GPU time-sharing without ArgoCD reverting
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
